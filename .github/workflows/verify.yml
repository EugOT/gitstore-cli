name: Verify

on:
  pull_request:
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: z3store-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: [self-hosted, build-runner]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: verify-fast
        run: bun scripts/verify-fast.ts
