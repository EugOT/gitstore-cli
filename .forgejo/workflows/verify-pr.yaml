name: verify-pr

on:
  pull_request:
    branches:
      - main
      - dev

concurrency:
  group: verify-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zig-gate:
    name: Zig quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install mise
        env:
          MISE_VERSION: v2025.1.0
        run: |
          curl -fsSL https://mise.run | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install Bun
        env:
          BUN_INSTALL_VERSION: 1.2.0
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> $GITHUB_PATH

      - name: Install Zig 0.16.0 via mise
        run: mise install zig@0.16.0

      - name: Verify Zig toolchain resolves
        run: mise x zig@0.16.0 -- zig version

      - name: Bun install
        # The repo commits `bun.lock`; CI must use --frozen-lockfile so the
        # lockfile cannot drift silently. If a contributor needs to refresh
        # deps, run `bun install` locally and commit bun.lock in the same PR.
        run: bun install --frozen-lockfile

      - name: Run verify-pr gate
        run: bash scripts/verify-pr.sh

  evals:
    name: Eval structural check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: zig-gate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun
        env:
          BUN_INSTALL_VERSION: 1.2.0
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> $GITHUB_PATH

      - name: Bun install
        run: bun install --frozen-lockfile

      - name: Run eval structural check
        run: bun scripts/eval.ts --check
