name: claude-review

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  group: claude-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: Claude review
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Claude Code Review
        # Pinned to the v1 immutable commit SHA per Forgejo + GitHub Actions
        # security guidance (third-party actions must be SHA-pinned so a
        # rewritten tag cannot inject arbitrary code). Bump along with the
        # upstream `v1` tag and verify with
        # `git ls-remote https://github.com/anthropics/claude-code-action.git v1`.
        uses: anthropics/claude-code-action@cacf511db27f37088382624faf2fe2f397735494 # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          mode: agent
          max_turns: 8
          setting_sources: project
          skills: zig-quality,zig-build-system,zig-fuzz-target
          prompt_file: .forgejo/prompts/review.md
