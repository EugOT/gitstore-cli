name: release

# This workflow is intentionally `workflow_dispatch`-only until the real
# Tier 4 release verification (verify-release.ts: clean rebuild,
# reproducibility check, deep fuzz, SBOM, signed-tag dry-run) is wired in.
# Auto-running on tag pushes used to greenlight every `v*.*.*` tag with a
# no-op success check, which weakened the release signal exactly where the
# repo claims it is strongest. Re-enable the `push.tags` trigger only after
# `verify-release` runs as a real step here.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to verify (informational only; the workflow does not push or sign)."
        required: false
        type: string

jobs:
  release-placeholder:
    name: Release placeholder
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Announce deferred release flow
        run: |
          echo "Release is handled in a separate flow per plan section 0.12."
          echo "This workflow is a skeleton only — no signing, no SBOM, no publish."
          echo "To ship a release, run verify-release locally through the release skill."
          exit 0
